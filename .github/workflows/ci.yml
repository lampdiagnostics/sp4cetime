name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size budget (calendar 150 KB, Fly mode 200 KB, gzipped JS)
        run: |
          main=$(ls dist/assets/index-*.js | xargs cat | gzip -9 | wc -c)
          fly=$(ls dist/assets/FlyView-*.js | xargs cat | gzip -9 | wc -c)
          echo "Calendar JS (gzip): $main bytes; Fly mode JS (gzip): $fly bytes"
          test "$main" -lt 153600
          test "$fly" -lt 204800
