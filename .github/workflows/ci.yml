name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size budget (150 KB of gzipped JS)
        run: |
          size=$(cat dist/assets/*.js | gzip -9 | wc -c)
          echo "JS bundle (gzip): $size bytes"
          test "$size" -lt 153600
